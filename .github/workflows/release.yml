name: Build macOS release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.5.6)'
        required: true
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Generate build resources
        run: npm run build:assets
      - name: Run tests
        run: npm test
      - name: Prepare macOS iPerf 2
        run: |
          brew install iperf
          mkdir -p bin/mac
          NTT_TARGET_OS=darwin npm run setup:binaries
          # HRUFT macOS binary must be supplied as a repository secret or built separately.
      - name: Build macOS packages
        run: npx electron-builder --mac -p never
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-packages
          path: |
            app_file/*.dmg
            app_file/*.zip
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          gh release upload "$TAG" app_file/*.dmg app_file/*.zip --clobber || true
